<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia+ | Acesso ao Sistema</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-icon">
                <i class="fa-solid fa-dumbbell"></i>
            </div>
            <h1 class="auth-title">Academia<span>+</span></h1>
            <p class="auth-subtitle">Sistema Acadêmico de Gestão Integrada & MySQL</p>
        </div>

        <div id="login-alert" class="alert alert-danger" style="display: none;"></div>

        <form id="form-login">
            <div class="form-group">
                <label class="form-label" for="email">E-mail de Acesso</label>
                <input type="email" id="email" class="form-control" placeholder="seu.email@academia.com.br" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="senha">Senha</label>
                <input type="password" id="senha" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema
            </button>
        </form>

        <div class="demo-credentials">
            <div class="demo-credentials-title">
                <i class="fa-solid fa-key"></i> Credenciais para Avaliação:
            </div>
            <div class="demo-btn-group">
                <button type="button" class="btn btn-outline btn-sm" id="btn-fill-admin" style="flex: 1;">
                    <i class="fa-solid fa-shield"></i> Administrador
                </button>
                <button type="button" class="btn btn-outline btn-sm" id="btn-fill-func" style="flex: 1;">
                    <i class="fa-solid fa-user"></i> Funcionário
                </button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('btn-fill-admin').addEventListener('click', () => {
            document.getElementById('email').value = 'admin@academia.com.br';
            document.getElementById('senha').value = 'admin123';
        });

        document.getElementById('btn-fill-func').addEventListener('click', () => {
            document.getElementById('email').value = 'recepcao@academia.com.br';
            document.getElementById('senha').value = 'func123';
        });

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const alertEl = document.getElementById('login-alert');
            const submitBtn = document.getElementById('btn-submit');

            alertEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Autenticando...';

            try {
                const res = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Credenciais inválidas');
                }

                // Armazena token e perfil do usuário autenticado
                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', JSON.stringify(data.usuario));

                // Redireciona para o Dashboard
                window.location.href = 'index.html';
            } catch (err) {
                alertEl.textContent = err.message;
                alertEl.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema';
            }
        });
    </script>
</body>
</html>
